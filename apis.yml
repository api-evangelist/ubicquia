- aid: ubicquia:ubicquia-config-api
  name: Ubicquia Config API
  description: 'The publicly described Ubicquia configuration and provisioning API ("Ubi Api",
    OpenAPI 3.0.0, 39 operations) covering sales orders, fulfillment details, device serial numbers
    and production files, distribution transformer and coil files, ICCID (cellular SIM) master
    records, customer lookup and user administration. Authenticated with an x-api-key header; the
    interactive Swagger UI at the same host redirects to a login, while the raw OpenAPI document is
    served publicly at /docs.'
