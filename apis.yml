aid: ubicquia
name: Ubicquia
description: 'Ubicquia is a Fort Lauderdale, Florida intelligent-infrastructure company that turns
  streetlights, distribution transformers, and substations that cities and utilities already own into
  connected, AI-monitored assets. Its plug-in hardware family — UbiCell (NEMA-socket streetlight
  controller), UbiHub and UbiHub AI+ (streetlight gigabit switch with cameras, edge AI and LTE),
  UbiGrid DTM+ (distribution transformer monitoring), UbiMetro (streetlight small cell) and UbiSmart
  AQM+ (air quality) — feeds the UbiVu analytics and asset-management platform, which the company
  states analyzes 4.3 billion data points daily. Ubicquia serves cities, electric utilities, public
  safety agencies and enterprises across grid monitoring, intelligent streetlighting, power quality,
  safety and security, street audit, substation monitoring, and traffic and curb management. It
  publicly serves an OpenAPI 3.0 description of its device configuration, provisioning and sales-order
  API at config.api.ubicquia.com, and raised a $106M Series D in 2026.'
