identifier_notes:
- Customers are keyed by an opaque string customer_id, plus a numeric parent_customer_id for hierarchy.
- Devices are keyed by serial_number and carry the radio identity set dev_eui / imei / imsi / mac_address
  / iccid.
- Users are keyed by a UUID (example d73e4a66-a015-442c-8f54-f84891386b0f) and carry hasApiAccess and
  hasUbiVuAccess booleans that gate this API and the UbiVu platform respectively.
- Sales orders are keyed by sales_order_number.
